<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0>

  <title>Conditionals Prototype 1</title>

  <!-- CSS stylesheet(s) -->
  <link rel="stylesheet" type="text/css" href="css/style.css" />

  <!-- Library script(s) -->

  <!-- p5.min.js is the main p5 library -->
  <script src="js/libraries/p5.min.js"></script>
  <!-- p5.sound.min.js allows us to use sound -->
  <script src="js/libraries/p5.sound.min.js"></script>

  <!-- My script(s) -->
  <script src="js/script.js"></script>
  <style>
    .container {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <p>Refresh for a new seed! Your seed is <span id="seed"></span></p>
  <p>or make your seed: (between -20 and 20)</p> 
  <div class="container">
    <input id="inputX" type="number" min="-20" max="20">
    <input id="inputY" type="number" min="-20" max="20">
    <button id="seedBtn" type="submit">enter</button>
  </div>
</body>

</html>
